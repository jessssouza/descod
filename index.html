<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>QR Code Card</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap");

    * {
      font-family: "Outfit", sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #d5e1ef;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      text-align: center;
    }

    .card {
      background-color: #ffffff;
      width: 30vw;
      min-width: 400px;
      border-radius: 2%;
      padding: 4% 0%;
      text-align: center;
    }

    .title {
      font-weight: 700;
      font-size: 2rem;
      margin: 4% 0;
    }

    .text {
      font-weight: 400;
      font-size: 1.5rem;
    }

    .image {
      width: 70%;
      min-width: 70%;
      border-radius: 4%;
    }

    .content {
      width: 70%;
      min-width: 70%;
      margin: 0 auto;
    }

    .challenge-text {
      margin-top: 20px;
      font-size: 1rem;
      color: hsl(220, 15%, 55%);
    }

    a {
      text-decoration: none;
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img class="image" src="https://github.com/jessssouza/descod/blob/qrcode/image-qr-code.png?raw=true" alt="QR Code Image">
      <div class="content">
        <p class="title">Improve your front-end skills by building projects</p>
        <p class="text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </div>

    <div class="challenge-text">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="#">Jessica Souza</a>.
    </div>
  </div>
</body>
</html>
